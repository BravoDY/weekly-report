<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>公众号发文与当前热度</title>
<style>
:root {
  --ink:oklch(0.18 0.01 240); --ink-secondary:oklch(0.38 0.012 240); --whisper:oklch(0.55 0.008 240); --silence:oklch(0.7 0.005 240);
  --parchment:oklch(0.98 0.003 60); --paper:oklch(1 0 0); --parchment-raised:oklch(0.96 0.005 60);
  --line-subtle:oklch(0 0 0 / 0.04); --line:oklch(0 0 0 / 0.08); --line-strong:oklch(0 0 0 / 0.12);
  --amber:oklch(0.65 0.15 65); --amber-soft:oklch(0.92 0.04 65);
  --slate:oklch(0.38 0.012 240); --slate-deep:oklch(0.18 0.01 240);
  --green:oklch(0.55 0.16 145); --red:oklch(0.55 0.18 25);
  --m-read:var(--slate); --m-share:var(--amber); --m-like:var(--ink-secondary); --m-comment:var(--whisper);
  --fs-xs:0.75rem; --fs-sm:0.8125rem; --fs-base:0.875rem; --fs-md:1rem; --fs-lg:1.125rem; --fs-xl:1.25rem; --fs-2xl:1.5rem;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700;
  --shadow-premium: 0 0 0 0.5px oklch(0 0 0 / 0.05), 0 1px 2px oklch(0 0 0 / 0.04), 0 2px 4px oklch(0 0 0 / 0.03), 0 4px 8px oklch(0 0 0 / 0.02);
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-full:9999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
}
[data-theme="dark"] {
  --ink:oklch(0.93 0.005 240); --ink-secondary:oklch(0.75 0.008 240); --whisper:oklch(0.6 0.008 240); --silence:oklch(0.45 0.005 240);
  --parchment:oklch(0.13 0.008 240); --paper:oklch(0.16 0.008 240); --parchment-raised:oklch(0.19 0.008 240);
  --line-subtle:oklch(1 0 0 / 0.04); --line:oklch(1 0 0 / 0.08); --line-strong:oklch(1 0 0 / 0.12);
  --amber:oklch(0.72 0.14 65); --amber-soft:oklch(0.25 0.04 65);
  --slate:oklch(0.7 0.008 240); --slate-deep:oklch(0.85 0.005 240);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:var(--fs-base); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
body { font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--parchment); color:var(--ink); line-height:1.5; min-height:100vh; font-variant-numeric:tabular-nums; overflow-x:hidden; }
a { color:var(--slate); text-decoration:none; }
a:hover, a:active { color:var(--amber); }
.page-wrap { max-width:1440px; margin:0 auto; padding:var(--s-3); }

.report-header { background:var(--paper); border-radius:var(--r-lg); padding:var(--s-4); margin-bottom:var(--s-3); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); border-top:3px solid var(--amber); }
.header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-3); flex-wrap:wrap; }
.header-left { flex:1; min-width:0; }
.header-badge { display:inline-flex; align-items:center; gap:var(--s-1); background:var(--amber-soft); color:var(--amber); font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); padding:3px var(--s-3); border-radius:var(--r-sm); margin-bottom:var(--s-2); text-transform:uppercase; }
.report-header h1 { font-size:var(--fs-xl); font-weight:var(--fw-bold); color:var(--ink); line-height:1.25; margin-bottom:var(--s-2); letter-spacing:var(--ls-tight); }
.range-note { display:inline-flex; align-items:center; flex-wrap:wrap; gap:var(--s-1); margin:0 0 var(--s-2); padding:4px var(--s-3); background:var(--amber-soft); color:var(--ink-secondary); font-size:var(--fs-xs); font-weight:var(--fw-med); letter-spacing:var(--ls-wide); border-radius:var(--r-sm); border:0.5px solid var(--line); line-height:1.4; max-width:100%; }
.range-note b { color:var(--amber); font-weight:var(--fw-bold); }
.header-actions { display:flex; gap:var(--s-2); align-items:center; flex-shrink:0; }
.icon-btn { display:inline-flex; align-items:center; gap:var(--s-1); padding:6px var(--s-3); min-height:36px; border:0.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--whisper); font-size:var(--fs-sm); font-weight:var(--fw-med); letter-spacing:var(--ls-wide); cursor:pointer; text-decoration:none; transition:all 150ms ease; }
.icon-btn:hover, .icon-btn:active { border-color:var(--amber); color:var(--amber); }
.icon-btn:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.icon-btn .icon { font-size:14px; line-height:1; }
.icon-btn.active { border-color:var(--amber); color:var(--amber); background:var(--paper-soft); }
.page-switch-wrap { display:flex; justify-content:center; margin:0 0 var(--s-2); }
.page-switch-track { display:inline-flex; padding:2px; gap:2px; background:var(--paper); border:0.5px solid var(--line-strong); border-radius:var(--r-full); box-shadow:var(--shadow-premium); }
.page-switch-item { min-width:72px; padding:3px 16px; text-align:center; line-height:1.3; font-size:var(--fs-sm); font-weight:var(--fw-bold); letter-spacing:var(--ls-wide); color:var(--whisper); border-radius:var(--r-full); text-decoration:none; transition:background 150ms ease, color 150ms ease, box-shadow 150ms ease; }
.page-switch-item:hover { color:var(--amber); background:var(--amber-soft); }
.page-switch-item.is-active { background:var(--slate); color:var(--paper); box-shadow:0 1px 3px oklch(0 0 0 / 0.18); pointer-events:none; }
.page-switch-item:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }

.toolbar { display:flex; gap:var(--s-3); margin-bottom:var(--s-3); flex-wrap:wrap; align-items:flex-start; }
.toolbar-group { display:flex; gap:var(--s-1); align-items:center; flex-wrap:wrap; max-width:100%; }
.toolbar-label { font-size:var(--fs-xs); color:var(--whisper); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); text-transform:uppercase; margin-right:var(--s-2); white-space:nowrap; flex-shrink:0; }
.chip { padding:5px var(--s-2); border:0.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--whisper); font-size:var(--fs-xs); font-weight:var(--fw-med); cursor:pointer; letter-spacing:var(--ls-wide); min-height:28px; white-space:nowrap; }
.chip:hover, .chip:active { border-color:var(--amber); color:var(--amber); }
.chip.active { background:var(--slate); color:var(--paper); border-color:var(--slate); }
.chip.amber-active { background:var(--amber); color:var(--paper); border-color:var(--amber); }
.chip-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex-wrap:nowrap !important; }
.chip-scroll::-webkit-scrollbar { display:none; }

/* v12: 就地下钻容器 */
.drill-inline {
  margin: var(--s-1) 0 var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--paper);
  border-left: 3px solid var(--amber);
  border-radius: var(--r-sm);
  box-shadow: 0 1px 2px 0 rgba(0,0,0,0.04);
  animation: drillSlide 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes drillSlide { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
.drill-header { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-bottom:var(--s-3); padding-bottom:var(--s-2); border-bottom:0.5px solid var(--line); font-size:13px; color:var(--ink-secondary); }
.drill-header b { color:var(--amber); font-weight:var(--fw-bold); }
.drill-header .drill-close { margin-left:auto; padding:3px 10px; border:0.5px solid var(--amber); background:transparent; color:var(--amber); border-radius:var(--r-sm); cursor:pointer; font-size:12px; font-weight:var(--fw-semi); letter-spacing:var(--ls-wide); }
.drill-header .drill-close:hover { background:var(--amber); color:var(--paper); }
.drill-mini-table { width:100%; border-collapse:collapse; font-size:12px; }
.drill-mini-table thead th { text-align:left; padding:var(--s-2) var(--s-3); color:var(--paper); background:var(--slate); font-weight:var(--fw-bold); font-size:var(--fs-xs); letter-spacing:var(--ls-wider); text-transform:uppercase; border-bottom:none; cursor:default; }
.drill-mini-table thead th:hover, .drill-mini-table thead th:active { background:var(--slate); }
.drill-mini-table td { padding:7px 8px; border-bottom:0.5px solid var(--line-subtle); color:var(--ink); }
.drill-mini-table td.num { text-align:right; font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:var(--fw-med); }
.drill-mini-table tr:hover td { background:var(--parchment-raised); }
.drill-mini-table .title-cell { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drill-mini-table .title-cell a { color:var(--slate); }
.drill-mini-table .title-cell a:hover { color:var(--amber); }
.drill-mini-table .topic-tag { padding:1px 6px; border-radius:3px; font-size:10px; font-weight:var(--fw-semi); background:var(--parchment-raised); color:var(--ink-secondary); }

.kpi-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-3); margin-bottom:var(--s-3); }
.kpi-card { background:var(--paper); border-radius:var(--r-md); padding:var(--s-3) var(--s-4); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); cursor:pointer; transition:all .15s; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.kpi-card:hover, .kpi-card:active { box-shadow:var(--shadow-premium-hover); transform:translateY(-1px); }
.kpi-card.active { border-color:var(--amber); box-shadow:var(--shadow-premium-hover), 0 0 0 2px var(--amber-soft); }
.kpi-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
.kpi-card[data-metric="read"]::before { background:var(--m-read); }
.kpi-card[data-metric="share"]::before { background:var(--m-share); }
.kpi-card[data-metric="like"]::before { background:var(--m-like); }
.kpi-card[data-metric="comment"]::before { background:var(--m-comment); }
.kpi-card.active::before { background:var(--amber); }
.kpi-label { font-size:10px; color:var(--whisper); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); text-transform:uppercase; margin-bottom:var(--s-1); }
.kpi-value-row { display:flex; align-items:baseline; gap:var(--s-1); flex-wrap:wrap; margin-bottom:var(--s-2); }
.kpi-value { font-size:var(--fs-xl); font-weight:var(--fw-bold); color:var(--ink); line-height:1; letter-spacing:var(--ls-tighter); }
.kpi-card[data-metric="read"] .kpi-value { color:var(--m-read); }
.kpi-card[data-metric="share"] .kpi-value { color:var(--m-share); }
.kpi-card[data-metric="like"] .kpi-value { color:var(--m-like); }
.kpi-card[data-metric="comment"] .kpi-value { color:var(--m-comment); }
.kpi-card.active .kpi-value { color:var(--amber); }
.kpi-delta { font-size:10px; font-weight:var(--fw-bold); padding:1px var(--s-1); border-radius:var(--r-sm); white-space:nowrap; }
.kpi-delta.up { color:var(--green); background:oklch(0.55 0.16 145 / 0.1); }
.kpi-delta.down { color:var(--red); background:oklch(0.55 0.18 25 / 0.1); }
.kpi-spark-wrap { margin-top:auto; }
.kpi-sparkline { height:22px; }
.kpi-sparkline svg { width:100%; height:100%; display:block; }
.spark-time { font-size:9px; color:var(--silence); margin-top:2px; display:flex; justify-content:space-between; font-family:ui-monospace,monospace; letter-spacing:var(--ls-wide); }

.chart-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:var(--s-3); margin-bottom:var(--s-3); }
.chart-card { background:var(--paper); border-radius:var(--r-md); padding:var(--s-4); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); }
.chart-card.col-12 { grid-column:span 12; }
.chart-card.col-6 { grid-column:span 6; }
.chart-title { font-size:var(--fs-base); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:var(--s-2); letter-spacing:var(--ls-tight); display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
.chart-title::before { content:''; width:3px; height:14px; background:var(--amber); border-radius:1px; flex-shrink:0; }
.chart-subtitle { font-size:var(--fs-xs); color:var(--whisper); font-weight:var(--fw-reg); margin-left:auto; text-align:right; max-width:min(62%, 520px); line-height:1.45; }
.chart-canvas { width:100%; height:300px; }

.pick-list { max-height:520px; overflow:auto; -webkit-overflow-scrolling:touch; }
.pick-row { display:grid; grid-template-columns:48px minmax(0,1fr) 56px; gap:8px; align-items:center; padding:7px 4px; border-bottom:0.5px solid var(--line-subtle); cursor:pointer; color:inherit; text-decoration:none; }
a.pick-row, a.quad-row { color:inherit; }
a.pick-row:hover { background:var(--parchment-raised); }
a.pick-row:hover .pick-title { color:var(--amber); }
.pick-row:hover { background:var(--parchment-raised); }
.pick-delta { font-size:11px; font-weight:700; color:var(--green); font-variant-numeric:tabular-nums; letter-spacing:var(--ls-tight); }
.pick-rank { font-size:11px; font-weight:700; color:var(--whisper); font-variant-numeric:tabular-nums; text-align:right; }
.pick-main { min-width:0; }
.pick-title { font-size:12px; color:var(--ink); font-weight:var(--fw-med); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.35; }
.pick-meta { font-size:10px; color:var(--whisper); margin-top:1px; display:flex; gap:6px; align-items:center; }
.pick-val { text-align:right; font-family:ui-monospace,monospace; font-size:11px; font-weight:700; color:var(--ink); }
.pick-spark { height:16px; margin-top:2px; }

.quad-view-select { margin-left:var(--s-1); max-width:148px; min-height:28px; padding:3px 8px; border:0.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--ink-secondary); font-size:var(--fs-xs); font-weight:var(--fw-med); cursor:pointer; }
.quad-view-select:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.quad-body { height:520px; min-height:520px; overflow:hidden; }
.quad-body .chart-canvas { height:100%; }
.quad-dropdowns { display:flex; flex-direction:column; height:100%; overflow:hidden; gap:8px; }
.quad-drop { flex:0 0 auto; display:flex; flex-direction:column; min-height:0; overflow:hidden; border:0.5px solid var(--line-subtle); border-radius:var(--r-sm); background:var(--parchment-raised); }
.quad-drop.is-open { flex:1 1 auto; background:var(--paper); }
.quad-drop-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; padding:8px 10px; border:0; background:transparent; font:inherit; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; flex:0 0 auto; }
.quad-drop-head:focus-visible { outline:2px solid var(--amber); outline-offset:-2px; }
.quad-drop-head::after { content:'▾'; color:var(--whisper); font-weight:400; font-size:11px; }
.quad-drop.is-open .quad-drop-head::after { content:'▴'; }
.quad-drop-head span { font-size:10px; font-weight:400; color:var(--whisper); margin-left:auto; margin-right:6px; }
.quad-drop-body { display:none; }
.quad-drop.is-open .quad-drop-body { display:block; flex:1 1 auto; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:0 8px 8px; }
.quad-row { display:grid; grid-template-columns:minmax(0,1fr) 64px; gap:8px; align-items:center; padding:6px 2px; border-bottom:0.5px solid var(--line-subtle); cursor:pointer; color:inherit; text-decoration:none; }
.quad-row:hover { background:var(--parchment-raised); }
.quad-row:hover .pick-title { color:var(--amber); }
.quad-row .pick-title { font-size:12px; }
.quad-row .pick-val { font-size:10px; font-weight:600; color:var(--ink-secondary); }
.drill-toggle { display:inline-block; width:14px; margin-right:6px; color:var(--whisper); cursor:pointer; font-size:10px; }
.spark-cell { cursor:pointer; }
.spark-cell:hover { background:var(--parchment-raised); }

.topic-matrix { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-2); }
.topic-cell { padding:var(--s-2) var(--s-3); background:var(--parchment-raised); border:0.5px solid var(--line-subtle); border-radius:var(--r-sm); cursor:pointer; transition:all .15s; display:flex; flex-direction:column; }
.topic-cell:hover, .topic-cell:active { border-color:var(--amber); box-shadow:var(--shadow-premium); }
.topic-cell.active { border-color:var(--amber); background:var(--amber-soft); }
.topic-cell-name { font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; }
.topic-cell-val { font-size:var(--fs-sm); font-family:ui-monospace,monospace; font-weight:var(--fw-bold); color:var(--ink-secondary); margin:2px 0; }
.topic-cell-spark { height:24px; }
.topic-cell-spark svg { width:100%; height:100%; display:block; }
.topic-cell .spark-time { margin-top:3px; }

.hotword-cloud { width:100%; height:280px; background:var(--paper); cursor:default; }
.hotword-cloud.is-empty { display:flex; align-items:center; justify-content:center; min-height:72px; height:auto; color:var(--whisper); font-size:13px; }

.table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r-sm); border:0.5px solid var(--line); }
table { width:100%; border-collapse:collapse; font-size:var(--fs-sm); min-width:700px; }
thead th { padding:var(--s-2) var(--s-3); text-align:left; font-weight:var(--fw-bold); font-size:var(--fs-xs); color:var(--paper); background:var(--slate); letter-spacing:var(--ls-wider); text-transform:uppercase; cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; }
thead th:hover, thead th:active { background:var(--slate-deep); }
thead th.sort-active { background:var(--amber); }
thead th .sort-arrow { margin-left:var(--s-1); font-size:10px; }
tbody td { padding:var(--s-2) var(--s-3); border-bottom:0.5px solid var(--line-subtle); vertical-align:middle; word-break:break-word; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover td, tbody tr:active td { background:var(--parchment-raised); }
tbody tr.expanded td { background:var(--amber-soft); }
td.title-cell { color:var(--slate); font-weight:var(--fw-med); max-width:240px; cursor:default; }
td.title-cell:hover { color:var(--ink); }
td.title-cell a { color:inherit; text-decoration:none; cursor:pointer; }
td.title-cell a:hover { color:var(--amber); }
.expand-title a { color:inherit; text-decoration:none; }
.expand-title a:hover { color:var(--amber); }
td.num { font-family:ui-monospace,"SF Mono",monospace; font-weight:var(--fw-med); text-align:right; letter-spacing:var(--ls-tight); white-space:nowrap; }
.heat-1 { color:oklch(0.7 0.05 65); }
.heat-2 { color:oklch(0.6 0.1 65); font-weight:var(--fw-med); }
.heat-3 { color:var(--amber); font-weight:var(--fw-bold); }
.heat-4 { color:var(--amber); font-weight:var(--fw-bold); }
.badge-topic { display:inline-block; font-size:var(--fs-xs); padding:1px var(--s-2); border-radius:var(--r-sm); background:var(--parchment-raised); color:var(--whisper); border:0.5px solid var(--line-subtle); font-weight:var(--fw-med); white-space:nowrap; }
.badge-topic.active { background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
.account-cell { color:var(--ink-secondary); font-size:var(--fs-xs); white-space:nowrap; }
.spark-cell { width:110px; }
.spark-cell-wrap { display:flex; flex-direction:column; gap:2px; }
.spark-cell svg { width:100%; height:18px; display:block; }

.expand-row td { padding:0 !important; background:var(--parchment-raised); }
.expand-content { padding:var(--s-3); }
.expand-title { font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:var(--s-2); letter-spacing:var(--ls-wide); }
.expand-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-3); }
.expand-cell { display:flex; flex-direction:column; }
.expand-cell-head { display:flex; align-items:baseline; gap:var(--s-1); margin-bottom:2px; }
.expand-metric-label { font-size:10px; color:var(--whisper); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:var(--ls-wider); }
.expand-metric-value { font-size:var(--fs-md); font-weight:var(--fw-bold); font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums; margin-left:auto; }
.expand-metric-spark { height:32px; overflow:hidden; }
.expand-metric-spark svg { max-width:100%; height:32px; }
.expand-metric-time { display:flex; justify-content:space-between; font-size:9px; color:var(--whisper); font-family:ui-monospace, monospace; letter-spacing:var(--ls-wide); margin-top:2px; }

.report-footer { text-align:center; font-size:var(--fs-xs); color:var(--whisper); padding:var(--s-4) 0; border-top:0.5px solid var(--line-subtle); margin-top:var(--s-3); letter-spacing:var(--ls-wide); }
.footer-logo { font-weight:var(--fw-bold); color:var(--slate); font-size:var(--fs-sm); letter-spacing:var(--ls-wider); text-transform:uppercase; }

function hotspotAidsForWord(word){
  if(!word) return null;
  const pool = (LAST_HOTSPOTS && LAST_HOTSPOTS.length) ? LAST_HOTSPOTS : (DATA.hotspots || []);
  const hit = pool.find(h => h && h.w === word);
  if(!hit) return null;
  const aids = Array.isArray(hit.aids) ? hit.aids : [];
  return new Set(aids.map(String));
}
function collectHotspotsForRange(){
  const windowArts = getFiltered();
  const byAid = {};
  windowArts.forEach(a => {
    if(!a || !a.aid) return;
    byAid[String(a.aid)] = { r: a.r || 0, a: a.a || '' };
  });
  const softMax = HOTSPOT_SOFT_MAX_BY_RANGE[STATE.rangeDays] || HOTSPOT_SOFT_MAX;
  const out = [];
  (DATA.hotspots || []).forEach(h => {
    if(!h || !h.w) return;
    const rawAids = Array.isArray(h.aids) ? h.aids.map(String) : [];
    const aids = rawAids.filter(id => byAid[id]);
    if(!aids.length) return;
    let scoreRaw = 0;
    const accounts = new Set();
    aids.forEach(id => {
      const meta = byAid[id];
      scoreRaw += Math.log1p(meta.r || 0);
      if(meta.a) accounts.add(meta.a);
    });
    const acctN = accounts.size || 1;
    const score = scoreRaw * (1 + 0.2 * (acctN - 1));
    out.push({ w: h.w, n: aids.length, score, aids });
  });
  out.sort((a, b) => b.score - a.score || b.n - a.n || b.w.length - a.w.length || (a.w < b.w ? -1 : 1));
  LAST_HOTSPOTS = out.slice(0, softMax);
  return LAST_HOTSPOTS;
}

  const sub = document.getElementById('hotwords-subtitle');
  const titleEl = document.getElementById('hotwords-title');
  if(!el) return;
  if(titleEl) titleEl.textContent = `近 ${STATE.rangeDays} 天热词`;
  if(sub) sub.textContent = '字越大越热（覆盖面、阅读、经营价值）· 点词看文章';
  const words = collectHotspotsForRange();
  if(!words.length){
    if(chartHotWords){ try{ chartHotWords.dispose(); }catch(e){} chartHotWords = null; }
    el.classList.add('is-empty');
    el.innerHTML = '暂无热词';
    return;
  }
  el.classList.remove('is-empty');
  // wordCloud 对 setOption 增量更新布局不稳（切窗口易叠字），每次重建实例
  if(chartHotWords){
    try{ chartHotWords.dispose(); }catch(e){}
    chartHotWords = null;
  }
  el.innerHTML = '';
  if(typeof echarts === 'undefined'){
    el.classList.add('is-empty');
    el.innerHTML = '图表组件未加载';
    return;
  }
  chartHotWords = echarts.init(el);
  const active = STATE.inlineDrills && STATE.inlineDrills.hotwords && STATE.inlineDrills.hotwords.word;
  const data = words.map((x, i) => ({
    name: String(x.w || ''),
    value: Math.log1p(Math.max(1, Number(x.score) || 0)),
    n: Number(x.n) || 0,
    textStyle: {
      color: HOTWORD_COLORS[i % HOTWORD_COLORS.length],
      fontWeight: (active && active === String(x.w || '')) ? 700 : 500
    }
  })).filter(d => d.name);
  // 用实心矩形 mask 铺满画布；仅靠 shape 极坐标时宽容器底部常吃不满
  const mask = document.createElement('canvas');
  mask.width = Math.max(1, el.clientWidth || chartHotWords.getWidth() || 1);
  mask.height = Math.max(1, el.clientHeight || chartHotWords.getHeight() || 1);
  const mctx = mask.getContext('2d');
  mctx.fillStyle = '#000';
  mctx.fillRect(0, 0, mask.width, mask.height);
  chartHotWords.setOption({
    tooltip: {
      show: true,
      formatter: p => {
        const n = (p.data && p.data.n) || 0;
        return `${p.name}<br/>出现 ${n} 篇<br/><span style="opacity:.75">点击查看文章</span>`;
      }
    },
    series: [{
      type: 'wordCloud',
      maskImage: mask,
      keepAspect: false,
      left: 0,
      top: 0,
      right: 0,
      bottom: 0,
      width: '100%',
      height: '100%',
      sizeRange: [11, 36],
      rotationRange: [0, 90],
      rotationStep: 90,
      gridSize: 4,
      drawOutOfBound: false,
      shrinkToFit: true,
      layoutAnimation: false,
      textStyle: {
        fontFamily: 'PingFang SC, Microsoft YaHei, system-ui, sans-serif',
        fontWeight: 500
      },
      emphasis: {
        focus: 'self',
        textStyle: { textShadowBlur: 4, textShadowColor: 'rgba(0,0,0,0.18)' }
      },
      data
    }]
  }, true);
  chartHotWords.off('click');
  chartHotWords.on('click', params => {
    const w = params && params.name;
    if(!w) return;
    const cur = STATE.inlineDrills && STATE.inlineDrills.hotwords;
    if(cur && cur.word === w) closeInlineDrill('hotwords');
    else openInlineDrill('hotwords', null, null, w);
    renderHotWords();
    const box = document.getElementById('drill-hotwords');
    if(box && box.style.display !== 'none'){
      setTimeout(() => box.scrollIntoView({behavior:'smooth', block:'nearest'}), 50);
    }
  });
}

function median(arr){
  if(!arr.length) return 0;
  const s = arr.slice().sort((a,b)=>a-b);
  return s[Math.floor(s.length / 2)];
}

function buildQuadGroups(data){
  const pool = data.filter(a => (a.r||0) > 0).map(a => ({
    a,
    r: a.r || 0,
    s: a.s || 0,
    rate: (a.s||0) / a.r * 100
  }));
  const mx = median(pool.map(p => p.r));
  const my = median(pool.map(p => p.rate));
  const take = (arr, n) => arr.slice(0, n);
  const groups = [
    {
      key: 'hit',
      name: '人多也爱转',
      hint: '值得优先看',
      color: '#D97706',
      items: take(pool.filter(p => p.r >= mx && p.rate >= my).sort((x,y)=> (y.r*y.rate) - (x.r*x.rate)), 15)
    },
    {
      key: 'reach',
      name: '人多但不转',
      hint: '看的人不少，没传开',
      color: '#334155',
      items: take(pool.filter(p => p.r >= mx && p.rate < my).sort((x,y)=> y.r - x.r), 15)
    },
    {
      key: 'gem',
      name: '人少但爱转',
      hint: '容易被漏掉',
      color: '#0F766E',
      items: take(pool.filter(p => p.r < mx && p.rate >= my).sort((x,y)=> y.rate - x.rate), 15)
    },
    {
      key: 'miss',
      name: '人少也不转',
      hint: '先不用盯',
      color: '#94A3B8',
      items: take(pool.filter(p => p.r < mx && p.rate < my).sort((x,y)=> y.r - x.r), 15)
    }
  ];
  return { pool, mx, my, groups };
}

function renderQuadChart(groups, mx, my){
  if(!chartQuad) return;
  const shortLabel = t => {
    const s = String(t||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"');
    return s.length > 10 ? s.slice(0, 10) + '…' : s;
  };
  const toPoint = p => ({
    name: p.a.t,
    value: [p.r, p.rate],
    link: p.a.link,
    acc: p.a.a,
    tp: p.a.tp || '其他',
    s: p.s
  });
  chartQuad.setOption({
    tooltip: {
      trigger: 'item',
      confine: true,
      backgroundColor: '#FFFFFF',
      borderColor: '#E2E8F0',
      borderWidth: 0.5,
      textStyle: { color: '#1C1917', fontSize: 12 },
      extraCssText: 'box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 6px; padding: 8px 12px;',
      formatter: p => {
        const d = p.data || {};
        const rate = (p.value && p.value[1] != null) ? p.value[1].toFixed(1) : '0';
        return `<b>${d.name||''}</b><br/>${d.acc||''} · ${d.tp||''}<br/>阅读 ${fmtNum(p.value[0])} · 分享 ${fmtNum(d.s||0)} · 分享率 ${rate}%`;
      }
    },
    legend: {
      top: 0,
      type: 'scroll',
      textStyle: { color: 'var(--ink-secondary)', fontSize: 11 },
      itemWidth: 10,
      itemHeight: 10
    },
    grid: { left: 52, right: 20, top: 48, bottom: 40 },
    xAxis: {
      type: 'log',
      name: '阅读',
      nameLocation: 'middle',
      nameGap: 24,
      nameTextStyle: { color: 'var(--whisper)', fontSize: 10 },
      axisLabel: { color: 'var(--whisper)', fontSize: 10, formatter: v => fmtNum(v) },
      splitLine: { lineStyle: { color: 'var(--line)', type: 'dashed' } }
    },
    yAxis: {
      type: 'value',
      name: '分享率%',
      nameTextStyle: { color: 'var(--whisper)', fontSize: 10 },
      axisLabel: { color: 'var(--whisper)', fontSize: 10, formatter: v => v.toFixed(0)+'%' },
      splitLine: { lineStyle: { color: 'var(--line)', type: 'dashed' } }
    },
    series: groups.map((g, idx) => ({
      name: g.name,
      type: 'scatter',
      data: g.items.map(toPoint),
      symbolSize: 11,
      itemStyle: { color: g.color, opacity: g.key === 'miss' ? 0.55 : 0.92 },
      label: {
        show: true,
        formatter: p => shortLabel(p.data && p.data.name),
        fontSize: 10,
        color: 'var(--ink-secondary)',
        position: 'top'
      },
      labelLayout: { hideOverlap: true },
      markLine: idx === 0 ? {
        silent: true,
        symbol: 'none',
        lineStyle: { color: '#94A3B8', type: 'dashed', width: 1 },
        label: { fontSize: 9, color: '#94A3B8' },
        data: [
          { xAxis: mx, label: { formatter: '阅读中位' } },
          { yAxis: my, label: { formatter: '分享中位' } }
        ]
      } : undefined
    }))
  }, true);
  chartQuad.off('click');
  chartQuad.on('click', params => {
    if(params.componentType !== 'series') return;
    const link = params.data && params.data.link;
    if(link) window.open(link, '_blank', 'noopener');
  });
}

function renderQuadList(groups){
  const el = document.getElementById('article-quads');
  if(!el) return;
  const openKey = STATE.quadOpen || (groups[0] && groups[0].key);
  STATE.quadOpen = openKey;
  el.innerHTML = groups.map(g => {
    const rows = g.items.length ? g.items.map(p => {
      const inner = `
        <div class="pick-main">
          <div class="pick-title">${escapeHtml(p.a.t)}</div>
          <div class="pick-meta"><span>${escapeHtml(p.a.a)}</span><span>${escapeHtml(p.a.tp || '其他')}</span></div>
        </div>
        <div class="pick-val">${fmtNum(p.r)}<br/>${p.rate.toFixed(1)}%</div>`;
      return articleTag(p.a, 'quad-row', inner);
    }).join('') : `<div style="padding:8px 2px;color:var(--whisper);font-size:12px">该象限暂无代表作</div>`;
    return `<div class="quad-drop${g.key===openKey?' is-open':''}" data-quad="${g.key}">
      <button type="button" class="quad-drop-head">${g.name}<span>${g.hint} · ${g.items.length} 篇</span></button>
      <div class="quad-drop-body">${rows}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.quad-drop').forEach(d => {
    d.querySelector('.quad-drop-head').onclick = () => {
      const key = d.dataset.quad;
      if(STATE.quadOpen === key) return;
      STATE.quadOpen = key;
      el.querySelectorAll('.quad-drop').forEach(o => o.classList.toggle('is-open', o.dataset.quad === key));
    };
  });
}

function renderValueQuads(data){
  const chartEl = document.getElementById('chart-quad');
  const listEl = document.getElementById('article-quads');
  const sel = document.getElementById('quad-view-select');
  if(sel) sel.value = STATE.quadView;
  const built = buildQuadGroups(data);
  const n = built.groups.reduce((s,g)=>s+g.items.length, 0);
  const sub = document.getElementById('quad-subtitle');
  const isChart = STATE.quadView !== 'list';
  if(sub) sub.textContent = isChart
    ? `横轴是阅读人数，纵轴是转发比例 · 点圆点打开原文`
    : `四个区各最多 15 篇 · 点标题打开原文`;
  if(!built.pool.length){
    if(chartQuad) chartQuad.clear();
    if(listEl) listEl.innerHTML = `<div style="padding:var(--s-4);text-align:center;color:var(--whisper);font-size:13px">暂无文章</div>`;
    return;
  }
  if(chartEl) chartEl.style.display = isChart ? '' : 'none';
  if(listEl) listEl.hidden = isChart;
  if(isChart){
    renderQuadChart(built.groups, built.mx, built.my);
    setTimeout(()=>{ if(chartQuad) chartQuad.resize(); }, 0);
  } else {
    renderQuadList(built.groups);
  }
}

function renderTopicMatrix(data){
  const byTopic = {};
  data.forEach(a => { if(!byTopic[a.tp]) byTopic[a.tp] = []; byTopic[a.tp].push(a); });
  const m = STATE.metric;
  // 与趋势图同序（活跃度降序）+ 同色板，主题颜色全站一致
  const topicEntries = Object.entries(byTopic).sort((x,y) => y[1].length - x[1].length);
  const container = document.getElementById('topic-matrix');
  container.innerHTML = topicEntries.map(([tp, arts], idx) => {
    const totalVal = arts.reduce((s,a)=>s+(a[METRIC_KEY[m]]||0), 0);
    const isActive = STATE.drillTopic === tp && !STATE.drillAccount;  // v12: 兼容下钻 active
    return `<div class="topic-cell ${isActive?'active':''}" data-topic-idx="${idx}">
      <div class="topic-cell-name">
        <span>${escapeHtml(tp)}</span>
        <span style="font-size:9px;color:var(--whisper);font-weight:400">${arts.length}篇</span>
      </div>
      <div class="topic-cell-val">${METRIC_LABEL[m]} ${fmtNum(totalVal)}</div>
    </div>`;
  }).join('');
  container.querySelectorAll('.topic-cell').forEach((cell, idx) => {
    const [tp, arts] = topicEntries[idx];
    cell.onclick = () => {
      // v12: 就地下钻到主题，在矩阵下方展开
      const cur = STATE.inlineDrills && STATE.inlineDrills.matrix;
      if(cur && cur.topic === tp && !cur.account) closeInlineDrill('matrix');
      else openInlineDrill('matrix', null, tp);
    };
    cell.style.cursor = 'pointer';
  });
  document.getElementById('matrix-subtitle').textContent = `每个主题近 ${STATE.rangeDays} 天发文的当前${METRIC_LABEL[m]} · 点格子看文章`;
}

function renderTable(data){
  let arr = data.slice();
  // 下钻维度优先（drillAccount + drillTopic 双维度下钻），降级用 topicSelected 单维度（chips 点击）
  const drillStatus = document.getElementById('drill-status');
  if(STATE.drillAccount || STATE.drillTopic){
    arr = arr.filter(a => {
      let ok = true;
      if(STATE.drillAccount) ok = ok && a.a === STATE.drillAccount;
      if(STATE.drillTopic) ok = ok && a.tp === STATE.drillTopic;
      return ok;
    });
    const parts = [];
    if(STATE.drillAccount) parts.push(`公众号 <b style="color:var(--amber)">${escapeHtml(STATE.drillAccount)}</b>`);
    if(STATE.drillTopic) parts.push(`主题 <b style="color:var(--amber)">${escapeHtml(STATE.drillTopic)}</b>`);
    drillStatus.style.display = 'block';
    drillStatus.innerHTML = `${parts.join(' <span style="color:var(--whisper)">×</span> ')} <span style="color:var(--whisper);margin-left:6px">· 共 ${arr.length} 篇</span> <button onclick="clearDrillDown()" style="margin-left:12px;padding:3px 10px;border:1px solid var(--amber);background:transparent;color:var(--amber);border-radius:3px;cursor:pointer;font-size:12px;font-weight:600">清除筛选</button>`;
  } else {
    if(STATE.topicSelected !== 'all') arr = arr.filter(a => a.tp === STATE.topicSelected);
    drillStatus.style.display = 'none';
  }
  const metric = METRIC_KEY[STATE.sortMetric];
  arr.sort((a,b) => STATE.sortDir === 'desc' ? (b[metric]||0)-(a[metric]||0) : (a[metric]||0)-(b[metric]||0));
  const sub = arr.slice(0, 50);  // 用过滤后的前 50 篇作为热力分级基线
  const heatLevel = (k, v) => {
    if(!sub.length || v === 0) return 0;
    const allVals = sub.map(x => x[k] || 0).sort((a,b)=>a-b);
    const pct = allVals.filter(x => x < v).length / allVals.length;
    if(pct >= 0.8) return 4; if(pct >= 0.6) return 3; if(pct >= 0.4) return 2; if(pct >= 0.2) return 1; return 0;
  };
  const tbody = document.getElementById('top-tbody');
  tbody.innerHTML = arr.slice(0, 20).map((a, i) => {
    const href = articleHref(a);
    const titleHtml = href ? `<a href="${href}" target="_blank" rel="noopener">${escapeHtml(a.t)}</a>` : escapeHtml(a.t);
    return `<tr data-row-idx="${i}">
      <td style="color:var(--whisper);font-weight:700">${i+1}</td>
      <td class="title-cell">${titleHtml}</td>
      <td class="account-cell">${escapeHtml(a.a)}</td>
      <td><span class="badge-topic ${a.tp===STATE.drillTopic?'active':''}">${escapeHtml(a.tp)}</span></td>
      <td class="num heat-${heatLevel('r', a.r)} ${STATE.sortMetric==='read'?'heat-4':''}">${a.r.toLocaleString()}</td>
      <td class="num heat-${heatLevel('s', a.s)} ${STATE.sortMetric==='share'?'heat-4':''}">${a.s}</td>
      <td class="num heat-${heatLevel('l', a.l)} ${STATE.sortMetric==='like'?'heat-4':''}">${a.l}</td>
      <td class="num heat-${heatLevel('c', a.c)} ${STATE.sortMetric==='comment'?'heat-4':''}">${a.c}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.classList.toggle('sort-active', th.dataset.sort === STATE.sortMetric);
    const arrow = th.querySelector('.sort-arrow');
    if(arrow) arrow.textContent = (th.dataset.sort === STATE.sortMetric) ? (STATE.sortDir === 'desc' ? '↓' : '↑') : '';
  });
  document.getElementById('table-subtitle').textContent = `按${METRIC_LABEL[STATE.sortMetric]}从高到低 · 点标题打开原文 · 数字为当前采集值`;
}

function renderTopicFilter(){
  const topics = [...new Set(getFiltered().map(a=>a.tp))].sort();
  const container = document.getElementById('topic-filter');
  container.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (STATE.topicSelected === 'all' ? ' active' : '');
  allChip.textContent = '全部'; allChip.onclick = () => { STATE.topicSelected = 'all'; STATE.drillTopic = null; STATE.drillAccount = null; renderAll(); };
  container.appendChild(allChip);
  topics.forEach(tp => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (STATE.topicSelected === tp ? ' amber-active' : '');
    chip.textContent = tp;
    chip.onclick = () => {
      // v12: chips 点击 = 全局表格筛选（不滚动，不影响 inline 下钻）
      if(STATE.topicSelected === tp){
        STATE.topicSelected = 'all';
        STATE.drillTopic = null;
      } else {
        STATE.topicSelected = tp;
        STATE.drillTopic = tp;
        STATE.drillAccount = null;
      }
      renderAll();
    };
    container.appendChild(chip);
  });
}

function renderAccountChips(){
  const accounts = [...new Set(getFiltered().map(a=>a.a))].sort();
  const c = document.getElementById('account-filter');
  c.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (STATE.accounts.size===0?' active':'');
  allChip.textContent='全部'; allChip.onclick=()=>{STATE.accounts.clear();renderAll();}; c.appendChild(allChip);
  accounts.forEach(acc => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (STATE.accounts.has(acc) ? ' amber-active' : '');
    chip.textContent = acc; chip.style.fontSize = 'var(--fs-xs)';
    chip.onclick = () => { if(STATE.accounts.has(acc)) STATE.accounts.delete(acc); else STATE.accounts.add(acc); renderAll(); };
    c.appendChild(chip);
  });
}

function renderAll(){
  const data = getFiltered();
  updateRangeNote();
  renderAccountChips(); renderTopicFilter();
  renderMomentum(data); renderValueQuads(data); renderHotWords();
  renderTopicMatrix(data); renderTable(data);
  if(STATE.inlineDrills){
    Object.keys(STATE.inlineDrills).forEach(mid => renderInlineDrill(mid));
  }
  document.querySelectorAll('.metric-chip').forEach(c => c.classList.toggle('active', c.dataset.metric === STATE.metric));
  document.querySelectorAll('.range-chip').forEach(c => c.classList.toggle('active', Number(c.dataset.range) === STATE.rangeDays));
}

document.querySelectorAll('.metric-chip').forEach(chip => {
  chip.onclick = () => { STATE.metric = chip.dataset.metric; STATE.sortMetric = chip.dataset.metric; STATE.sortDir='desc'; renderAll(); };
});
document.querySelectorAll('.range-chip').forEach(chip => {
  chip.onclick = () => setRangeDays(chip.dataset.range);
});
const quadViewSel = document.getElementById('quad-view-select');
if(quadViewSel){
  quadViewSel.onchange = () => {
    STATE.quadView = quadViewSel.value;
    renderValueQuads(getFiltered());
  };
}
document.querySelectorAll('thead th[data-sort]').forEach(th => {
  th.onclick = () => {
    const m = th.dataset.sort;
    if(STATE.sortMetric===m) STATE.sortDir = STATE.sortDir==='desc'?'asc':'desc';
    else { STATE.sortMetric=m; STATE.sortDir='desc'; }
    STATE.metric = m; renderAll();
  };
});
const themeBtn = document.getElementById('theme-toggle');
const savedTheme = localStorage.getItem('dashboard-theme');
if(savedTheme==='dark'){document.documentElement.setAttribute('data-theme','dark');themeBtn.textContent='☀️';}
themeBtn.onclick = () => {
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  if(isDark){document.documentElement.removeAttribute('data-theme');themeBtn.textContent='🌙';localStorage.setItem('dashboard-theme','light');}
  else {document.documentElement.setAttribute('data-theme','dark');themeBtn.textContent='☀️';localStorage.setItem('dashboard-theme','dark');}
  setTimeout(()=>renderAll(),50);
};
const bt = document.getElementById('back-top');
window.addEventListener('scroll', ()=>{bt.classList.toggle('show',window.scrollY>400);},{passive:true});
bt.onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(chartQuad) chartQuad.resize(); if(chartHotWords) chartHotWords.resize();},150);});

initCharts(); renderAll();
</script>
