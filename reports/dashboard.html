<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>行业热点内容看板 · v10 (2026-08-11)</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root {
  --ink:oklch(0.18 0.01 240); --ink-secondary:oklch(0.38 0.012 240); --whisper:oklch(0.55 0.008 240); --silence:oklch(0.7 0.005 240);
  --parchment:oklch(0.98 0.003 60); --paper:oklch(1 0 0); --parchment-raised:oklch(0.96 0.005 60);
  --line-subtle:oklch(0 0 0 / 0.04); --line:oklch(0 0 0 / 0.08); --line-strong:oklch(0 0 0 / 0.12);
  --amber:oklch(0.65 0.15 65); --amber-soft:oklch(0.92 0.04 65);
  --slate:oklch(0.38 0.012 240); --slate-deep:oklch(0.18 0.01 240);
  --green:oklch(0.55 0.16 145); --red:oklch(0.55 0.18 25);
  --m-read:var(--slate); --m-share:var(--amber); --m-like:var(--ink-secondary); --m-comment:var(--whisper);
  --fs-xs:0.75rem; --fs-sm:0.8125rem; --fs-base:0.875rem; --fs-md:1rem; --fs-lg:1.125rem; --fs-xl:1.25rem; --fs-2xl:1.5rem;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700;
  --shadow-premium: 0 0 0 0.5px oklch(0 0 0 / 0.05), 0 1px 2px oklch(0 0 0 / 0.04), 0 2px 4px oklch(0 0 0 / 0.03), 0 4px 8px oklch(0 0 0 / 0.02);
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
}
[data-theme="dark"] {
  --ink:oklch(0.93 0.005 240); --ink-secondary:oklch(0.75 0.008 240); --whisper:oklch(0.6 0.008 240); --silence:oklch(0.45 0.005 240);
  --parchment:oklch(0.13 0.008 240); --paper:oklch(0.16 0.008 240); --parchment-raised:oklch(0.19 0.008 240);
  --line-subtle:oklch(1 0 0 / 0.04); --line:oklch(1 0 0 / 0.08); --line-strong:oklch(1 0 0 / 0.12);
  --amber:oklch(0.72 0.14 65); --amber-soft:oklch(0.25 0.04 65);
  --slate:oklch(0.7 0.008 240); --slate-deep:oklch(0.85 0.005 240);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:var(--fs-base); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
body { font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--parchment); color:var(--ink); line-height:1.5; min-height:100vh; font-variant-numeric:tabular-nums; overflow-x:hidden; }
a { color:var(--slate); text-decoration:none; }
a:hover, a:active { color:var(--amber); }
.page-wrap { max-width:1280px; margin:0 auto; padding:var(--s-3); }

.report-header { background:var(--paper); border-radius:var(--r-lg); padding:var(--s-4); margin-bottom:var(--s-3); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); border-top:3px solid var(--amber); }
.header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s-3); flex-wrap:wrap; }
.header-left { flex:1; min-width:0; }
.header-badge { display:inline-flex; align-items:center; gap:var(--s-1); background:var(--amber-soft); color:var(--amber); font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); padding:3px var(--s-3); border-radius:var(--r-sm); margin-bottom:var(--s-2); text-transform:uppercase; }
.report-header h1 { font-size:var(--fs-xl); font-weight:var(--fw-bold); color:var(--ink); line-height:1.25; margin-bottom:var(--s-2); letter-spacing:var(--ls-tight); }
.header-meta { font-size:var(--fs-sm); color:var(--whisper); }
.header-actions { display:flex; gap:var(--s-2); align-items:center; flex-shrink:0; }
.icon-btn { display:inline-flex; align-items:center; gap:var(--s-1); padding:6px var(--s-3); min-height:36px; border:0.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--whisper); font-size:var(--fs-sm); font-weight:var(--fw-med); letter-spacing:var(--ls-wide); cursor:pointer; text-decoration:none; transition:all 150ms ease; }
.icon-btn:hover, .icon-btn:active { border-color:var(--amber); color:var(--amber); }
.icon-btn:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
.icon-btn .icon { font-size:14px; line-height:1; }
.icon-btn.active { border-color:var(--amber); color:var(--amber); background:var(--paper-soft); }

.toolbar { display:flex; gap:var(--s-3); margin-bottom:var(--s-3); flex-wrap:wrap; align-items:flex-start; }
.toolbar-group { display:flex; gap:var(--s-1); align-items:center; flex-wrap:wrap; max-width:100%; }
.toolbar-label { font-size:var(--fs-xs); color:var(--whisper); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); text-transform:uppercase; margin-right:var(--s-2); white-space:nowrap; flex-shrink:0; }
.chip { padding:5px var(--s-2); border:0.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); color:var(--whisper); font-size:var(--fs-xs); font-weight:var(--fw-med); cursor:pointer; letter-spacing:var(--ls-wide); min-height:28px; white-space:nowrap; }
.chip:hover, .chip:active { border-color:var(--amber); color:var(--amber); }
.chip.active { background:var(--slate); color:var(--paper); border-color:var(--slate); }
.chip.amber-active { background:var(--amber); color:var(--paper); border-color:var(--amber); }
.chip-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex-wrap:nowrap !important; }
.chip-scroll::-webkit-scrollbar { display:none; }

/* v12: 就地下钻容器 */
.drill-inline {
  margin: var(--s-1) 0 var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--paper);
  border-left: 3px solid var(--amber);
  border-radius: var(--r-sm);
  box-shadow: 0 1px 2px 0 rgba(0,0,0,0.04);
  animation: drillSlide 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes drillSlide { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
.drill-header { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-bottom:var(--s-3); padding-bottom:var(--s-2); border-bottom:0.5px solid var(--line); font-size:13px; }
.drill-header b { color:var(--amber); font-weight:var(--fw-bold); }
.drill-header .drill-close { margin-left:auto; padding:3px 10px; border:0.5px solid var(--amber); background:transparent; color:var(--amber); border-radius:var(--r-sm); cursor:pointer; font-size:12px; font-weight:var(--fw-semi); letter-spacing:var(--ls-wide); }
.drill-header .drill-close:hover { background:var(--amber); color:var(--paper); }
.drill-mini-table { width:100%; border-collapse:collapse; font-size:12px; }
.drill-mini-table th { text-align:left; padding:6px 8px; color:var(--whisper); font-weight:var(--fw-med); border-bottom:0.5px solid var(--line); font-size:11px; letter-spacing:var(--ls-wide); }
.drill-mini-table td { padding:7px 8px; border-bottom:0.5px solid var(--line-subtle); color:var(--ink); }
.drill-mini-table td.num { text-align:right; font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:var(--fw-med); }
.drill-mini-table tr:hover td { background:var(--paper-soft); }
.drill-mini-table .title-cell { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drill-mini-table .topic-tag { padding:1px 6px; border-radius:3px; font-size:10px; font-weight:var(--fw-semi); background:var(--paper-soft); color:var(--ink-secondary); }

.kpi-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-3); margin-bottom:var(--s-3); }
.kpi-card { background:var(--paper); border-radius:var(--r-md); padding:var(--s-3) var(--s-4); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); cursor:pointer; transition:all .15s; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.kpi-card:hover, .kpi-card:active { box-shadow:var(--shadow-premium-hover); transform:translateY(-1px); }
.kpi-card.active { border-color:var(--amber); box-shadow:var(--shadow-premium-hover), 0 0 0 2px var(--amber-soft); }
.kpi-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
.kpi-card[data-metric="read"]::before { background:var(--m-read); }
.kpi-card[data-metric="share"]::before { background:var(--m-share); }
.kpi-card[data-metric="like"]::before { background:var(--m-like); }
.kpi-card[data-metric="comment"]::before { background:var(--m-comment); }
.kpi-card.active::before { background:var(--amber); }
.kpi-label { font-size:10px; color:var(--whisper); font-weight:var(--fw-bold); letter-spacing:var(--ls-wider); text-transform:uppercase; margin-bottom:var(--s-1); }
.kpi-value-row { display:flex; align-items:baseline; gap:var(--s-1); flex-wrap:wrap; margin-bottom:var(--s-2); }
.kpi-value { font-size:var(--fs-xl); font-weight:var(--fw-bold); color:var(--ink); line-height:1; letter-spacing:var(--ls-tighter); }
.kpi-card[data-metric="read"] .kpi-value { color:var(--m-read); }
.kpi-card[data-metric="share"] .kpi-value { color:var(--m-share); }
.kpi-card[data-metric="like"] .kpi-value { color:var(--m-like); }
.kpi-card[data-metric="comment"] .kpi-value { color:var(--m-comment); }
.kpi-card.active .kpi-value { color:var(--amber); }
.kpi-delta { font-size:10px; font-weight:var(--fw-bold); padding:1px var(--s-1); border-radius:var(--r-sm); }
.kpi-delta.up { color:var(--green); background:oklch(0.55 0.16 145 / 0.1); }
.kpi-delta.down { color:var(--red); background:oklch(0.55 0.18 25 / 0.1); }
.kpi-spark-wrap { margin-top:auto; }
.kpi-sparkline { height:22px; }
.kpi-sparkline svg { width:100%; height:100%; display:block; }
.spark-time { font-size:9px; color:var(--silence); margin-top:2px; display:flex; justify-content:space-between; font-family:ui-monospace,monospace; letter-spacing:var(--ls-wide); }

.chart-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:var(--s-3); margin-bottom:var(--s-3); }
.chart-card { background:var(--paper); border-radius:var(--r-md); padding:var(--s-4); box-shadow:var(--shadow-premium); border:0.5px solid var(--line-subtle); }
.chart-card.col-12 { grid-column:span 12; }
.chart-title { font-size:var(--fs-base); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:var(--s-2); letter-spacing:var(--ls-tight); display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
.chart-title::before { content:''; width:3px; height:14px; background:var(--amber); border-radius:1px; flex-shrink:0; }
.chart-subtitle { font-size:var(--fs-xs); color:var(--whisper); font-weight:var(--fw-reg); margin-left:auto; }
.chart-canvas { width:100%; height:300px; }

.topic-matrix { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-2); }
.topic-cell { padding:var(--s-2) var(--s-3); background:var(--parchment-raised); border:0.5px solid var(--line-subtle); border-radius:var(--r-sm); cursor:pointer; transition:all .15s; display:flex; flex-direction:column; }
.topic-cell:hover, .topic-cell:active { border-color:var(--amber); box-shadow:var(--shadow-premium); }
.topic-cell.active { border-color:var(--amber); background:var(--amber-soft); }
.topic-cell-name { font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; }
.topic-cell-val { font-size:var(--fs-sm); font-family:ui-monospace,monospace; font-weight:var(--fw-bold); color:var(--ink-secondary); margin:2px 0; }
.topic-cell-spark { height:24px; }
.topic-cell-spark svg { width:100%; height:100%; display:block; }
.topic-cell .spark-time { margin-top:3px; }

.table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r-sm); border:0.5px solid var(--line); }
table { width:100%; border-collapse:collapse; font-size:var(--fs-sm); min-width:700px; }
thead th { padding:var(--s-2) var(--s-3); text-align:left; font-weight:var(--fw-bold); font-size:var(--fs-xs); color:var(--paper); background:var(--slate); letter-spacing:var(--ls-wider); text-transform:uppercase; cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; }
thead th:hover, thead th:active { background:var(--slate-deep); }
thead th.sort-active { background:var(--amber); }
thead th .sort-arrow { margin-left:var(--s-1); font-size:10px; }
tbody td { padding:var(--s-2) var(--s-3); border-bottom:0.5px solid var(--line-subtle); vertical-align:middle; word-break:break-word; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover td, tbody tr:active td { background:var(--parchment-raised); }
tbody tr.expanded td { background:var(--amber-soft); }
td.title-cell { color:var(--slate); font-weight:var(--fw-med); max-width:240px; cursor:pointer; }
td.title-cell:hover { color:var(--amber); }
td.title-cell a { color:inherit; }
td.num { font-family:ui-monospace,"SF Mono",monospace; font-weight:var(--fw-med); text-align:right; letter-spacing:var(--ls-tight); white-space:nowrap; }
.heat-1 { color:oklch(0.7 0.05 65); }
.heat-2 { color:oklch(0.6 0.1 65); font-weight:var(--fw-med); }
.heat-3 { color:var(--amber); font-weight:var(--fw-bold); }
.heat-4 { color:var(--amber); font-weight:var(--fw-bold); }
.badge-topic { display:inline-block; font-size:var(--fs-xs); padding:1px var(--s-2); border-radius:var(--r-sm); background:var(--parchment-raised); color:var(--whisper); border:0.5px solid var(--line-subtle); font-weight:var(--fw-med); white-space:nowrap; }
.badge-topic.active { background:var(--amber-soft); color:var(--amber); border-color:var(--amber); }
.account-cell { color:var(--ink-secondary); font-size:var(--fs-xs); white-space:nowrap; }
.spark-cell { width:110px; }
.spark-cell-wrap { display:flex; flex-direction:column; gap:2px; }
.spark-cell svg { width:100%; height:18px; display:block; }

.expand-row td { padding:0 !important; background:var(--parchment-raised); }
.expand-content { padding:var(--s-3); }
.expand-title { font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--ink); margin-bottom:var(--s-2); letter-spacing:var(--ls-wide); }
.expand-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s-3); }
.expand-cell { display:flex; flex-direction:column; }
.expand-cell-head { display:flex; align-items:baseline; gap:var(--s-1); margin-bottom:2px; }
.expand-metric-label { font-size:10px; color:var(--whisper); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:var(--ls-wider); }
.expand-metric-value { font-size:var(--fs-md); font-weight:var(--fw-bold); font-family:ui-monospace, monospace; font-variant-numeric:tabular-nums; margin-left:auto; }
.expand-metric-spark { height:32px; overflow:hidden; }
.expand-metric-spark svg { max-width:100%; height:32px; }
.expand-metric-time { display:flex; justify-content:space-between; font-size:9px; color:var(--whisper); font-family:ui-monospace, monospace; letter-spacing:var(--ls-wide); margin-top:2px; }

.report-footer { text-align:center; font-size:var(--fs-xs); color:var(--whisper); padding:var(--s-4) 0; border-top:0.5px solid var(--line-subtle); margin-top:var(--s-3); letter-spacing:var(--ls-wide); }
.footer-logo { font-weight:var(--fw-bold); color:var(--slate); font-size:var(--fs-sm); letter-spacing:var(--ls-wider); text-transform:uppercase; }
#back-top { position:fixed; right:var(--s-3); bottom:var(--s-4); width:40px; height:40px; background:var(--slate); color:var(--paper); font-size:18px; line-height:40px; text-align:center; border-radius:var(--r-sm); cursor:pointer; box-shadow:var(--shadow-premium-hover); opacity:0; pointer-events:none; transition:opacity .3s,transform .15s; z-index:500; border:0.5px solid var(--line-strong); }
#back-top.show { opacity:1; pointer-events:auto; }
#back-top:hover, #back-top:active { transform:translateY(-2px); background:var(--amber); }

@media (max-width:768px) {
  :root { --fs-base:0.9rem; }
  .page-wrap { padding:var(--s-2); }
  .report-header { padding:var(--s-3); }
  .report-header h1 { font-size:var(--fs-lg); }
  .header-meta { font-size:var(--fs-xs); }
  .toolbar { gap:var(--s-2); }
  .toolbar-group { width:100%; }
  .kpi-bar { grid-template-columns:repeat(2,1fr); gap:var(--s-2); }
  .kpi-card { padding:var(--s-2) var(--s-3); }
  .kpi-value { font-size:var(--fs-lg); }
  .kpi-sparkline { height:18px; }
  .chart-grid { gap:var(--s-2); }
  .chart-card { padding:var(--s-3); }
  .chart-canvas { height:320px; }
  .topic-matrix { grid-template-columns:repeat(2,1fr); }
  .expand-grid { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:480px) {
  :root { --fs-base:0.875rem; }
  .kpi-bar { grid-template-columns:1fr 1fr; gap:var(--s-1); }
  .kpi-card { padding:var(--s-2) var(--s-3); border-radius:var(--r-sm); }
  .kpi-value { font-size:var(--fs-base); }
  .chart-card { padding:var(--s-2) var(--s-3); border-radius:var(--r-sm); }
  .chart-canvas { height:300px; }
  .topic-matrix { grid-template-columns:1fr; }
  table { font-size:var(--fs-xs); min-width:580px; }
  thead th, tbody td { padding:var(--s-1) var(--s-2); }
  td.title-cell { max-width:140px; }
  .spark-cell { width:80px; }
  .expand-grid { grid-template-columns:1fr; }
  #back-top { width:36px; height:36px; font-size:16px; line-height:36px; }
}
@media (hover:none) and (pointer:coarse) {
  .chip, .icon-btn, .kpi-card, .topic-cell, td.title-cell { -webkit-tap-highlight-color:transparent; }
  .chip:hover, .icon-btn:hover, .kpi-card:hover { transform:none; }
  thead th { cursor:default; }
}
</style>
</head>
<body>
<div class="page-wrap">

<header class="report-header">
  <div class="header-row">
    <div class="header-left">
      <div class="header-badge">内容看板 · v10</div>
      <h1>公众号文章趋势分析</h1>
      <div class="header-meta">公众号×主题改堆叠条形图 · 纵=公众号 横=主题分段 · 流向感更强</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" title="切换暗色模式" aria-label="切换暗色模式"><span class="icon">🌙</span><span>暗色</span></button>
      <a class="icon-btn" href="report.html" title="返回最新周报"><span class="icon">📰</span><span>周报</span></a>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-group">
    <span class="toolbar-label">时间</span>
    <div class="chip-scroll" style="display:flex;gap:4px">
      <button class="chip" data-range="7">7 天</button>
      <button class="chip active" data-range="14">14 天</button>
      <button class="chip" data-range="30">30 天</button>
      <button class="chip" data-range="all">全部</button>
    </div>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">指标</span>
    <div class="chip-scroll" style="display:flex;gap:4px">
      <button class="chip metric-chip active" data-metric="read">阅读</button>
      <button class="chip metric-chip" data-metric="share">分享</button>
      <button class="chip metric-chip" data-metric="like">在看</button>
      <button class="chip metric-chip" data-metric="comment">留言</button>
    </div>
  </div>
  <div class="toolbar-group" style="width:100%">
    <span class="toolbar-label">公众号</span>
    <div class="chip-scroll" id="account-filter" style="display:flex;gap:4px;flex:1"></div>
  </div>
</div>

<div class="kpi-bar" id="kpi-bar">
  <div class="kpi-card active" data-metric="read">
    <div class="kpi-label">总阅读</div>
    <div class="kpi-value-row"><span class="kpi-value" id="kpi-read">—</span><span class="kpi-delta up" id="kpi-read-delta">—</span></div>
    <div class="kpi-spark-wrap"><div class="kpi-sparkline" id="kpi-spark-read"></div><div class="spark-time" id="kpi-time-read"></div></div>
  </div>
  <div class="kpi-card" data-metric="share">
    <div class="kpi-label">总分享</div>
    <div class="kpi-value-row"><span class="kpi-value" id="kpi-share">—</span><span class="kpi-delta up" id="kpi-share-delta">—</span></div>
    <div class="kpi-spark-wrap"><div class="kpi-sparkline" id="kpi-spark-share"></div><div class="spark-time" id="kpi-time-share"></div></div>
  </div>
  <div class="kpi-card" data-metric="like">

const STATE = { range:14, metric:'read', sortMetric:'read', sortDir:'desc', accounts:new Set(), topicSelected:'all', expandedRow:null, drillAccount:null, drillTopic:null, inlineDrills:{}, inlineExpanded:{} };
const METRIC_KEY = { read:'r', share:'s', like:'l', comment:'c' };

// 下钻清除：重置表格的下钻维度，回到全集
function clearDrillDown(){
  STATE.drillAccount = null;
  STATE.drillTopic = null;
  STATE.topicSelected = 'all';  // 同步 chips/矩阵的 active 状态
  renderAll();
}
// 设置下钻并滚动到表格
function drillTo(account, topic){
  STATE.drillAccount = account || null;
  STATE.drillTopic = topic || null;
  STATE.topicSelected = topic || 'all';  // 同步 chips/矩阵高亮
  renderAll();
  setTimeout(() => {
    const tbl = document.querySelector('.table-card') || document.getElementById('top-table');
    if(tbl) tbl.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
}

// v12: 就地下钻 - 在指定模块下方就地渲染 Top 文章（不跳到表格）
// moduleId: 'trend' | 'matrix' | 'stack'，对应容器 #drill-{moduleId}
function openInlineDrill(moduleId, account, topic){
  if(!STATE.inlineDrills) STATE.inlineDrills = {};
  STATE.inlineDrills[moduleId] = { account, topic };
  renderInlineDrill(moduleId);
}
function closeInlineDrill(moduleId){
  if(!STATE.inlineDrills) return;
  delete STATE.inlineDrills[moduleId];
  // 清掉该模块下的所有展开文章
  if(STATE.inlineExpanded){
    Object.keys(STATE.inlineExpanded).forEach(k => { if(k.startsWith(moduleId+'_')) delete STATE.inlineExpanded[k]; });
  }
  const el = document.getElementById('drill-' + moduleId);
  if(el) el.style.display = 'none';
}
function renderInlineDrill(moduleId){
  const drill = STATE.inlineDrills && STATE.inlineDrills[moduleId];
  const el = document.getElementById('drill-' + moduleId);
  if(!el) return;
  if(!drill){ el.style.display = 'none'; return; }
  const data = getFiltered();
  const { account, topic } = drill;
  let arr = data.filter(a => {
    let ok = true;
    if(account) ok = ok && a.a === account;
    if(topic) ok = ok && a.tp === topic;
    return ok;
  });
  const m = STATE.metric;
  const metricKey = METRIC_KEY[m];
  arr.sort((a,b) => (b[metricKey]||0) - (a[metricKey]||0));
  arr = arr.slice(0, 10);  // 最多 10 篇
  const dateRange = getRangeDates();
  // 标题行
  const parts = [];
  if(account) parts.push(`公众号 <b>${account}</b>`);
  if(topic) parts.push(`主题 <b>${topic}</b>`);
  const label = parts.join(' <span style="color:var(--whisper);font-weight:400">×</span> ');
  let html = `<div class="drill-header"><span style="color:var(--ink);font-weight:var(--fw-med)">📌 下钻：</span>${label}<span style="color:var(--whisper);margin-left:6px">· ${arr.length} 篇 · 按${METRIC_LABEL[m]}排序</span><button class="drill-close" onclick="closeInlineDrill('${moduleId}')">✕ 关闭</button></div>`;
  if(arr.length === 0){
    html += `<div style="padding:var(--s-3);text-align:center;color:var(--whisper);font-size:13px">该组合下无文章</div>`;
  } else {
    html += `<table class="drill-mini-table"><thead><tr><th>#</th><th>标题</th><th>公众号</th><th>主题</th><th class="num">阅读</th><th class="num">分享</th><th class="num">在看</th><th class="num">留言</th></tr></thead><tbody>`;
    arr.forEach((a, i) => {
      const isExp = STATE.inlineExpanded && STATE.inlineExpanded[`${moduleId}_${i}`];
      html += `<tr class="drill-row"><td>${i+1}</td><td class="title-cell drill-title" onclick="toggleInlineArticle('${moduleId}', ${i})" style="cursor:pointer;color:var(--amber);font-weight:var(--fw-semi)" title="点击展开 4 维趋势">${isExp ? '▼' : '▶'} ${a.t}</td><td style="color:var(--ink-secondary)">${a.a}</td><td><span class="topic-tag">${a.tp}</span></td><td class="num">${a.r.toLocaleString()}</td><td class="num">${a.s}</td><td class="num">${a.l}</td><td class="num">${a.c}</td></tr>`;
      if(isExp){
        const hist = genHistory(a);
        html += `<tr class="drill-detail"><td colspan="8"><div class="expand-grid" style="margin-top:var(--s-1);padding:var(--s-2) 0;border-top:0.5px solid var(--line)">${['read','share','like','comment'].map(k => {
          const values = hist.map(h => h[k]);
          const v = a[METRIC_KEY[k]];
          return `<div class="expand-cell">
            <div class="expand-cell-head">
              <span class="expand-metric-label" style="color:${METRIC_COLOR[k]}">${METRIC_LABEL[k]}</span>
              <span class="expand-metric-value" style="color:${METRIC_COLOR[k]}">${fmtNum(v)}</span>
            </div>
            <div class="expand-metric-spark">${miniSparkline(values, METRIC_COLOR[k], 200, 28)}</div>
            <div class="expand-metric-time"><span>${dateRange[0]}</span><span>${dateRange[1]}</span></div>
          </div>`;
        }).join('')}</div></td></tr>`;
      }
    });
    html += `</tbody></table>`;
  }
  el.innerHTML = html;
  el.style.display = 'block';
}
// 切换 inline 下钻容器里某篇文章的 4 维展开
function toggleInlineArticle(moduleId, idx){
  if(!STATE.inlineExpanded) STATE.inlineExpanded = {};
  const key = `${moduleId}_${idx}`;
  STATE.inlineExpanded[key] = !STATE.inlineExpanded[key];
  renderInlineDrill(moduleId);
}
const METRIC_HEX = { read:'#334155', share:'#D97706', like:'#475569', comment:'#64748B' };
const METRIC_COLOR = { read:'var(--m-read)', share:'var(--m-share)', like:'var(--m-like)', comment:'var(--m-comment)' };
const TODAY = new Date('2026-08-11');

function fmtNum(n){ if(n>=10000) return (n/10000).toFixed(1)+'w'; if(n>=1000) return (n/1000).toFixed(1)+'k'; return String(Math.round(n)); }
function fmtPct(n){ const sign = n>=0?'+':''; return sign + n.toFixed(0) + '%'; }
function fmtDate(d){ return d.toISOString().slice(5,10); }
function getRangeDates(){
  if(STATE.range === 'all') return ['7/13', '8/11'];
  const end = new Date(TODAY);
  const start = new Date(TODAY); start.setDate(start.getDate() - STATE.range);
  return [fmtDate(start), fmtDate(end)];
}

function genHistory(article){
  const pubDate = new Date(article.d);
  const daysSincePub = Math.max(1, Math.floor((TODAY - pubDate) / 86400000) + 1);
  const totalDays = Math.min(30, daysSincePub);
  const points = [];
  for(let i=0; i<totalDays; i++){
    const factor = Math.log(i + 2) / Math.log(totalDays + 1);
    const noise = 1 + (Math.sin(i * 1.3 + article.r) * 0.05);
    points.push({
      day: i,
      read: Math.max(0, Math.round(article.r * factor * noise)),
      share: Math.max(0, Math.round(article.s * factor * noise)),
      like: Math.max(0, Math.round(article.l * factor * noise)),
      comment: Math.max(0, Math.round(article.c * factor * noise))
    });
  }
  if(points.length) points[points.length-1] = { day: totalDays-1, read: article.r, share: article.s, like: article.l, comment: article.c };
  return points;
}

function miniSparkline(values, color, w=80, h=18){
  if(!values || values.length < 2) return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"></svg>`;
  const max = Math.max(...values, 1);
  const min = Math.min(...values);
  const range = max - min || 1;
  const stepX = w / (values.length - 1);
  const pts = values.map((v, i) => `${(i*stepX).toFixed(1)},${(h-1-((v-min)/range)*(h-2)).toFixed(1)}`);
  const lastX = ((values.length-1)*stepX).toFixed(1);
  const lastY = (h-1-((values[values.length-1]-min)/range)*(h-2)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="1.5" fill="${color}"/>
  </svg>`;
}

function renderAccountTrend(data){
  const accounts = [...new Set(data.map(a=>a.a))];
  const dateList = [];
  for(let i=29; i>=0; i--){
    const d = new Date(TODAY); d.setDate(d.getDate()-i);
    dateList.push(fmtDate(d));
  }
  const m = STATE.metric;
  const hex = METRIC_HEX[m];
  const series = accounts.map((acc, i) => {
    const accArticles = data.filter(a => a.a === acc);
    const daily = dateList.map((_, idx) => {
      const dayDate = new Date(TODAY); dayDate.setDate(dayDate.getDate() - (29 - idx));
      return accArticles.reduce((sum, a) => {
        const hist = genHistory(a);
        const daysSincePub = Math.floor((dayDate - new Date(a.d)) / 86400000);

        const histIdx = Math.min(daysSincePub, hist.length - 1);
        return sum + (hist[histIdx]?.[m] || 0);
      }, 0);
    });
    const lineStyle = i === 0 ? { width: 2.5 } : { width: 1.2, type: 'dashed' };
    return { name: acc, type: 'line', data: daily, smooth: true, symbol: 'none', lineStyle: { color: hex, ...lineStyle }, itemStyle: { color: hex }, emphasis: { focus: 'series', lineStyle: { width: 3 } } };
  });
  chartAccountTrend.setOption({
    tooltip: { trigger: 'axis', confine: true, formatter: p => {
      let h = p[0].axisValue + '<br/>';

    }},
    legend: { top: 0, textStyle: { color: 'var(--whisper)', fontSize: 11 }, itemWidth: 12, itemHeight: 8, type: 'scroll' },
    grid: { left: 45, right: 20, top: 35, bottom: 30 },
    xAxis: { type: 'category', data: dateList, axisLine: { lineStyle: { color: 'var(--line)' } }, axisLabel: { color: 'var(--whisper)', fontSize: 10, rotate: 30 } },
    yAxis: { type: 'value', axisLine: { lineStyle: { color: 'var(--line)' } }, axisLabel: { color: 'var(--whisper)', fontSize: 10, formatter: v => fmtNum(v) }, splitLine: { lineStyle: { color: 'var(--line-subtle)' } } },
    series
  }, true);

  // v12: 点击折线就地下钻到该公众号所有文章

// 公众号×主题 横向堆叠条形图（v11 替代热力图，流向感更强）
// Y 轴=公众号 Top10，每行堆叠分段=不同主题（颜色区分），长度=当前指标值
const TOPIC_COLORS = [
  '#334155','#D97706','#57534E','#0F766E','#4338CA',
  '#C2410C','#047857','#0E7490','#6D28D9','#BE123C',
  '#4D7C0F','#A21CAF','#0369A1','#A16207','#7C2D12'
];
function renderStack(data){
  const m = STATE.metric;
  const metricKey = METRIC_KEY[m];
  // 计算公众号总值，按降序取 Top 10
  const accTotal = {};
  data.forEach(a => accTotal[a.a] = (accTotal[a.a] || 0) + (a[metricKey] || 0));
  const topAccs = Object.entries(accTotal).sort((a,b)=>b[1]-a[1]).slice(0, 10).map(x=>x[0]);
  // 计算主题总值，按降序取 Top 8（避免颜色过多）
  const topicTotal = {};
  data.forEach(a => topicTotal[a.tp] = (topicTotal[a.tp] || 0) + (a[metricKey] || 0));
  const topTopics = Object.entries(topicTotal).sort((a,b)=>b[1]-a[1]).slice(0, 8).map((x,i)=>({name:x[0], color: TOPIC_COLORS[i % TOPIC_COLORS.length]}));
  // 构造每个主题 series：data 数组按公众号顺序填充该主题值
  const series = topTopics.map(t => {
    const arr = topAccs.map(acc => {
      const v = data.filter(a => a.a === acc && a.tp === t.name).reduce((s,a)=>s+(a[metricKey]||0), 0);
      return v;
    });
    return {
      name: t.name,
      type: 'bar',
      stack: 'total',
      data: arr,
      itemStyle: { color: t.color, borderColor: '#FAFAF9', borderWidth: 1 },
      emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.25)', borderColor: '#1C1917', borderWidth: 1.5 } },
      label: {
        show: true,
        color: '#FFFFFF',
        fontSize: 10,
        fontWeight: 600,
        formatter: p => {
          const v = p.value;
          if(v === 0) return '';
          if(v >= 10000) return (v/10000).toFixed(1)+'w';
          if(v >= 1000) return (v/1000).toFixed(1)+'k';
          return v;
        }
      }
    };
  });
  // 反转公众号顺序（ECharts 横向条形图 Y 轴从下往上，反转后 Top1 在顶部）
  const yAxisData = topAccs.slice().reverse();
  const seriesReversed = series.map(s => ({...s, data: s.data.slice().reverse()}));
  chartStack.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: '#FFFFFF',
      borderColor: '#E2E8F0',
      borderWidth: 0.5,
      textStyle: { color: '#1C1917', fontSize: 12 },
      extraCssText: 'box-shadow: 0 8px 24px rgba(0,0,0,0.12); border-radius: 6px; padding: 8px 12px;',
      formatter: p => {
        const acc = topAccs.slice().reverse()[p.dimensionIndex];
        const v = p.value;
        if(v === 0) return `<b>${acc}</b> × <b>${p.seriesName}</b><br/><span style="color:#9CA3AF">无文章</span>`;
        return `<b>${acc}</b> × <b>${p.seriesName}</b><br/>${METRIC_LABEL[m]}: <b style="color:${p.color}">${fmtNum(v)}</b>`;
      }
    },
    legend: {
      data: topTopics.map(t=>t.name),
      top: 0,
      type: 'scroll',
      textStyle: { color: 'var(--ink-secondary)', fontSize: 11 },
      itemWidth: 12,
      itemHeight: 12,
      itemGap: 12
    },
    grid: { left: 100, right: 30, top: 40, bottom: 30 },
    xAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: 'var(--line)' } },
      axisLabel: { color: 'var(--ink-secondary)', fontSize: 10, formatter: v => fmtNum(v) },
      splitLine: { lineStyle: { color: 'var(--line)', type: 'dashed' } }
    },
    yAxis: {
      type: 'category',
      data: yAxisData,
      axisLine: { lineStyle: { color: 'var(--line)' } },
      axisLabel: { color: 'var(--ink)', fontSize: 11, fontWeight: 600 },
      axisTick: { show: false }
    },
    series: seriesReversed,
    animationDuration: 600,
    animationEasing: 'cubicOut'
  }, true);
  document.getElementById('stack-subtitle').textContent = `按${METRIC_LABEL[m]} · 每行分段=主题 · 点击分段就地下钻`;
  // v12: 点击分段就地下钻（双维度：公众号×主题），用 params.name 取 Y 轴 category 值
  chartStack.off('click');
  chartStack.on('click', (params) => {
    if(params.componentType !== 'series') return;
    const acc = params.name;  // Y 轴 category 值 = 公众号名（修复 bug：之前用 dimensionIndex 错了）
    const topic = params.seriesName;  // 系列名 = 主题
    const v = params.value;
    if(!acc || !topic || !v || v === 0) return;
    openInlineDrill('stack', acc, topic);
  });
}

function renderTable(data){
  let arr = data.slice();
  // 下钻维度优先（drillAccount + drillTopic 双维度下钻），降级用 topicSelected 单维度（chips 点击）

    });
    const parts = [];
    if(STATE.drillAccount) parts.push(`公众号 <b style="color:var(--amber)">${STATE.drillAccount}</b>`);
    if(STATE.drillTopic) parts.push(`主题 <b style="color:var(--amber)">${STATE.drillTopic}</b>`);
    drillStatus.style.display = 'block';
    drillStatus.innerHTML = `<span style="color:var(--ink)">📌 下钻：</span>${parts.join(' <span style="color:var(--whisper)">×</span> ')} <span style="color:var(--whisper);margin-left:6px">· 共 ${arr.length} 篇</span> <button onclick="clearDrillDown()" style="margin-left:12px;padding:3px 10px;border:1px solid var(--amber);background:transparent;color:var(--amber);border-radius:3px;cursor:pointer;font-size:12px;font-weight:600">✕ 清除下钻</button>`;
  } else {
    if(STATE.topicSelected !== 'all') arr = arr.filter(a => a.tp === STATE.topicSelected);
    drillStatus.style.display = 'none';
  }
  const metric = METRIC_KEY[STATE.sortMetric];
  arr.sort((a,b) => STATE.sortDir === 'desc' ? (b[metric]||0)-(a[metric]||0) : (a[metric]||0)-(b[metric]||0));
  const sub = arr.slice(0, 50);  // 用过滤后的前 50 篇作为热力分级基线
  const heatLevel = (k, v) => {
    if(!sub.length || v === 0) return 0;
    const allVals = sub.map(x => x[k] || 0).sort((a,b)=>a-b);
    const pct = allVals.filter(x => x < v).length / allVals.length;
    if(pct >= 0.8) return 4; if(pct >= 0.6) return 3; if(pct >= 0.4) return 2; if(pct >= 0.2) return 1; return 0;
  };
  const m = STATE.metric;
  const sparkColor = METRIC_COLOR[m];
  const [startD, endD] = getRangeDates();
  const tbody = document.getElementById('top-tbody');
  tbody.innerHTML = arr.slice(0, 20).map((a, i) => {
    const hist = genHistory(a);
    const sparkValues = hist.map(h => h[m]);
    const isExpanded = STATE.expandedRow === i;
    return `<tr data-row-idx="${i}" class="${isExpanded?'expanded':''}">
      <td style="color:var(--whisper);font-weight:700">${i+1}</td>
      <td class="title-cell" data-expand="${i}"><a href="#" onclick="return false">${a.t}</a></td>
      <td class="account-cell">${a.a}</td>
      <td><span class="badge-topic ${a.tp===STATE.drillTopic?'active':''}">${a.tp}</span></td>
      <td class="spark-cell"><div class="spark-cell-wrap">${miniSparkline(sparkValues, sparkColor, 100, 18)}<div class="spark-time"><span>${startD}</span><span>${endD}</span></div></div></td>
      <td class="num heat-${heatLevel('r', a.r)} ${STATE.sortMetric==='read'?'heat-4':''}">${a.r.toLocaleString()}</td>
      <td class="num heat-${heatLevel('s', a.s)} ${STATE.sortMetric==='share'?'heat-4':''}">${a.s}</td>
      <td class="num heat-${heatLevel('l', a.l)} ${STATE.sortMetric==='like'?'heat-4':''}">${a.l}</td>
      <td class="num heat-${heatLevel('c', a.c)} ${STATE.sortMetric==='comment'?'heat-4':''}">${a.c}</td>
    </tr>${isExpanded ? `<tr class="expand-row"><td colspan="9"><div class="expand-content" id="expand-content-${i}"></div></td></tr>` : ''}`;
  }).join('');
  document.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.classList.toggle('sort-active', th.dataset.sort === STATE.sortMetric);
    const arrow = th.querySelector('.sort-arrow');
    if(arrow) arrow.textContent = (th.dataset.sort === STATE.sortMetric) ? (STATE.sortDir === 'desc' ? '↓' : '↑') : '';
  });
  tbody.querySelectorAll('.title-cell').forEach(cell => {
    cell.onclick = () => {
      const idx = parseInt(cell.dataset.expand);
      STATE.expandedRow = (STATE.expandedRow === idx) ? null : idx;
      renderTable(getFiltered());
      if(STATE.expandedRow === idx) setTimeout(() => renderExpand(arr[idx], idx), 30);
    };
  });
  document.getElementById('table-subtitle').textContent = `行内${METRIC_LABEL[m]} · 点击标题展开 4 维`;
}

function renderKPI(data){
  const metrics = ['read','share','like','comment'];
  const [startD, endD] = getRangeDates();
  metrics.forEach(m => {
    const total = data.reduce((s,a)=>s+(a[METRIC_KEY[m]]||0),0);
    document.getElementById('kpi-'+m).innerHTML = fmtNum(total);
    const daily = [];
    for(let i=29; i>=0; i--){
      const dayDate = new Date(TODAY); dayDate.setDate(dayDate.getDate()-i);
      const dayTotal = data.reduce((s, a) => {
        const hist = genHistory(a);
        const daysSincePub = Math.floor((dayDate - new Date(a.d)) / 86400000);
        if(daysSincePub < 0) return s;
        const idx = Math.min(daysSincePub, hist.length - 1);
        return s + (hist[idx]?.[m] || 0);
      }, 0);
      daily.push(dayTotal);
    }
    const recent7 = daily.slice(-7).reduce((a,b)=>a+b,0)/7;
    const prev7 = daily.slice(-14, -7).reduce((a,b)=>a+b,0)/7;
    const delta = prev7 > 0 ? ((recent7 - prev7) / prev7 * 100) : 0;
    const deltaEl = document.getElementById('kpi-'+m+'-delta');
    deltaEl.textContent = fmtPct(delta);
    deltaEl.className = 'kpi-delta ' + (delta >= 0 ? 'up' : 'down');
    document.getElementById('kpi-spark-'+m).innerHTML = miniSparkline(daily, METRIC_COLOR[m], 220, 22);
    document.getElementById('kpi-time-'+m).innerHTML = `<span>${startD}</span><span>${endD}</span>`;
  });
}
