<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运动户外行业舆情周报</title>
  <style>
    /* 基础重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      line-height: 1.8;
      padding: 20px;
    }

    /* 最大宽度容器 */
    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 报告头部 */
    .report-header {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      border-radius: 12px;
      padding: 32px 36px;
      margin-bottom: 24px;
    }
    .report-header h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      border: none;
      color: white;
    }
    .report-meta {
      font-size: 14px;
      opacity: 0.85;
    }

    /* ── 目录导航：横排 Flex 布局 ── */
    .toc {
      background: white;
      border-radius: 10px;
      padding: 16px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .toc-title {
      font-size: 13px;
      font-weight: 600;
      color: #636e72;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .toc-links {
      display: flex;
      flex-wrap: wrap;           /* 超出宽度自动换行 */
      gap: 10px 16px;            /* 行间距10px，列间距16px */
      align-items: center;
    }
    .toc-links a {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      background: #f0f4ff;
      color: #2a5298;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: 20px;       /* 胶囊形标签 */
      border: 1px solid #d6e0ff;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;       /* 单个条目不换行 */
    }
    .toc-links a:hover {
      background: #2a5298;
      color: white;
    }

    /* 各段模块卡片 */
    .section-card {
      background: white;
      border-radius: 10px;
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* 标题样式 */
    h2 { display: none; }
    h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1e3c72;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e8ecf8;
    }
    h4 {
      font-size: 15px;
      font-weight: 600;
      color: #2d3436;
      margin: 20px 0 10px;
    }

    /* 列表样式 */
    ul, ol {
      padding-left: 0;
      list-style: none;
    }
    li {
      padding: 8px 0 8px 16px;
      border-bottom: 1px solid #f7f8fc;
      position: relative;
      font-size: 14px;
    }
    li:before {
      content: "▸";
      position: absolute;
      left: 0;
      color: #2a5298;
    }
    li:last-child { border-bottom: none; }

    /* 表格样式 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 12px 0;
    }
    th {
      background: #1e3c72;
      color: white;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #edf0f7;
      vertical-align: top;
    }
    tr:nth-child(even) td { background: #f8f9fe; }
    tr:hover td { background: #eef1fb; }

    /* 加粗 */
    strong { color: #1e3c72; font-weight: 700; }

    /* 来源链接样式：一行内联 */
    .source-inline {
      font-size: 12px;
      color: #636e72;
      display: inline;
    }
    .source-inline a {
      color: #2a5298;
      text-decoration: none;
      font-size: 12px;
    }
    .source-inline a:hover {
      text-decoration: underline;
    }
    .source-inline .source-sep {
      color: #b2bec3;
      margin: 0 4px;
      font-size: 12px;
    }

    /* 手机端适配 */
    hr {
      border: none;
      border-top: 1px solid #edf0f7;
      margin: 24px 0;
    }

    /* 底部版权 */
    .report-footer {
      text-align: center;
      padding: 24px;
      color: #b2bec3;
      font-size: 13px;
    }

    /* 手机端适配 */
    @media (max-width: 640px) {
      body { padding: 12px; }
      .section-card { padding: 20px 16px; }
      .report-header { padding: 24px 20px; }
      table { font-size: 12px; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- 报告头部 -->
    <div class="report-header">
      <h2>运动户外行业舆情周报</h2>
      <div class="report-meta">
        📰 共 N 篇文章 &nbsp;|&nbsp; 📅 2026-03-02 &nbsp;|&nbsp; 迪桑特品牌团队内部周报
      </div>
    </div>

    <!-- 目录（横排胶囊标签） -->
    <div class="toc">
      <div class="toc-title">本期目录</div>
      <div class="toc-links">
        <a href="#section-1">🧭 本周战略判断</a>
        <a href="#section-2">📈 关键数据速查</a>
        <a href="#section-3">🧩 行业深度洞察</a>
        <a href="#section-4">🥊 竞品情报雷达</a>
        <a href="#section-5">🎯 本周舆情温度</a>
      </div>
    </div>

    <!-- 正文内容 -->
    

    <!-- 底部 -->
    <div class="report-footer">
      迪桑特电商团队 · 运动户外行业舆情周报 · 仅供内部参考
    </div>

  </div>
</body>
</html>
